<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions - University of Dukes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <header>
    <nav>
      <div><img src="images/UoDLogoR.png" alt="logo image" style="width: 200px; height: auto;"></div>
      <div class="nav-links-container">
        <ul class="nav-links">
          <li><a href="index.html"><i class="fa-solid fa-house-user"></i> Home</a></li>
          <li><a href="admissions.html"><i class="fa-solid fa-ticket"></i> Admissions</a></li>
          <li><a href="#"><i class="fa-solid fa-building"></i> Campus-Life</a></li>
          <li><a href="#"><i class="fa-solid fa-book"></i> Academics</a></li>
          <li><a href="about.html"><i class="fa-solid fa-address-card"></i> About Us</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- Admissions Form Section -->
  <section class="container-form">
    <section id="admissions-form">
      <h2>Registration Form</h2>
      <form action="submit_form.php" method="post">
        <fieldset>
          <legend>Personal Information</legend>
          <div class="names">
            <div>
              <div>
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>
              </div>
              <div>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
              </div>
            </div>
            <div>
              <div>
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>
              </div>
              <div>
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Contact Details</legend>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" required>

          <label for="address">Address:</label>
          <textarea id="address" name="address" rows="3" required></textarea>
        </fieldset>

        <fieldset>
          <legend>Other Information</legend>
          <label for="course">Select Course:</label>
          <select id="course" name="course" required>
            <option value="">Select</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Business Administration">Business Administration</option>
            <option value="Engineering">Engineering</option>
            <option value="Medicine">Medicine</option>
            <option value="Law">Law</option>
            <option value="International Relations">International Relations</option>
          </select>
          <label for="source">How you found out about University of Dukes</label>
          <select id="source" name="source">
            <option value="" disabled selected>Select value</option>
            <option value="social">Social Media</option>
            <option value="friend">Friend</option>
            <option value="website">Website</option>
          </select>
          <div class="consent">
            <input type="checkbox" id="consent" required>
            <label for="consent">I consent to the collection of this data and its processing in accordance with University of Dukes Privacy Policy.</label>
          </div>
        </fieldset>
        <button type="submit">Submit</button>
      </form>
    </section>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 University of Dukes. All Rights Reserved.</p>
  </footer>
</body>
</html>
